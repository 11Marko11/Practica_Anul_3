# Render Blueprint for the API (server/). Render → New → Blueprint → pick this repository.
services:
  - type: web
    name: rent-motors-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    # Dev dependencies (Prisma CLI, TypeScript) are needed to build and to run migrations.
    buildCommand: npm ci --include=dev && npm run build
    # The free plan has no pre-deploy step, so pending migrations run right before the server starts.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # entered in the Render dashboard, never committed
      - key: SITE_URL
        value: https://practica-anul-3-seven.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false # Stripe → Developers → API keys → Secret key (sk_test_…)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # Stripe → Developers → Webhooks → your endpoint → Signing secret (whsec_…)
